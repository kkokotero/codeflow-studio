pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

# Los scripts de instalación de estas dependencias se ejecutan siempre:
# el binario de esbuild lo necesita la cadena de herramientas de las pruebas.
onlyBuiltDependencies:
  - esbuild

# El vigilante de archivos solo se usa mientras se developa, así que no hace
# falta compilarlo en el despliegue.
ignoredBuiltDependencies:
  - '@parcel/watcher'
